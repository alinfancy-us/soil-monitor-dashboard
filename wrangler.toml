# Cloudflare Pages 配置：GitHub Actions（deploy.yml）通过 `wrangler pages deploy` 发布 dist/。
# 注意：自定义域名 soilpulse.alinfancy.com 在 Cloudflare Pages 控制台绑定——
# Pages 项目不支持 wrangler.toml 的 routes / custom_domain 字段（那是 Workers 的配置方式）。
name = "soil-monitor-dashboard"
compatibility_date = "2025-01-01"

# 静态资产目录：GitHub Actions 会先组装干净的 dist（只含 index.html + page/）
pages_build_output_dir = "dist"
