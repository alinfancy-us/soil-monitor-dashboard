name: github-pages-deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: '请输入发布版本号 (例如 1.3.8 或 v1.3.8)'
        required: true
        default: '1.3.8'
      fw_url:
        description: '固件 bin 下载 URL (留空则不更新固件，文件名须按 SoilPulse_v<版本>.bin 或 SoilPulse_<commit哈希>.bin 命名)'
        required: false
        default: ''
      fw_notes:
        description: '固件升级说明 (可选，留空默认写入 test firmware)'
        required: false
        default: ''

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署，避免并发互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync PAGE_VERSION / DASHBOARD_URL from Input
        run: |
          # 去掉用户输入可能带有的 v 前缀
          RAW_VERSION="${{ github.event.inputs.version }}"
          VERSION=${RAW_VERSION#v}
          echo "Syncing PAGE_VERSION to $VERSION..."
          
          # 自动替换 page/js/config.js 中的 PAGE_VERSION
          sed -i "s/const PAGE_VERSION = '[^']*';/const PAGE_VERSION = '$VERSION';/g" page/js/config.js
          
          # dev 预览发布到 GitHub Pages，Bluefy 深链落地页须同步替换为 Pages 地址
          # （生产 deploy.yml 发布到 Cloudflare，固定为自定义域名 https://soilpulse.alinfancy.com）
          echo "Syncing DASHBOARD_URL to GitHub Pages URL..."
          sed -i "s|const DASHBOARD_URL = '[^']*';|const DASHBOARD_URL = 'https://alinfancy-us.github.io/soil-monitor-dashboard/';|g" page/js/config.js

          # 验证替换结果
          grep -E "PAGE_VERSION|DASHBOARD_URL" page/js/config.js

      # 从 fw_url 拉取固件并更新升级清单，isforce=true 强制提醒升级：
      # 用于验证非正式测试固件（commit 哈希命名）；后续把 fw_url 换成正式版 Release URL，
      # 同样强制提醒，即可把刷了测试固件的设备覆盖回正式版。
      # 浏览器 OTA 始终从 page/firmware/<bin> 同源下载，fw_url 仅在 CI 下载阶段使用
      - name: Download firmware & Sync firmware.json
        if: ${{ github.event.inputs.fw_url != '' }}
        env:
          FW_URL: ${{ github.event.inputs.fw_url }}
          FW_RAW_NOTES: ${{ github.event.inputs.fw_notes }}
          FW_TOKEN: ${{ secrets.FW_REPO_TOKEN }}
        run: |
          # bin 文件名取 URL 路径最后一段（去掉查询参数）
          FW_BIN="${FW_URL%%\?*}"
          FW_BIN="${FW_BIN##*/}"
          if [ -z "$FW_BIN" ]; then
            echo "::error::无法从 fw_url 解析出 bin 文件名: ${FW_URL}"
            exit 1
          fi

          # 从文件名解析清单版本号：正式版 SoilPulse_v<版本>.bin（如 SoilPulse_v2.1.1.bin）；
          # 非正式测试版用 commit 哈希 <哈希>.bin（如 SoilPulse_a1b2c3.bin 或 a1b2c3.bin）
          if [[ "$FW_BIN" =~ ^(SoilPulse_)?[vV]([0-9]+(\.[0-9]+)+)\.bin$ ]]; then
            FW_VERSION="${BASH_REMATCH[2]}"
          elif [[ "$FW_BIN" =~ ^(SoilPulse_)?([0-9a-fA-F]{6,40})\.bin$ ]]; then
            FW_VERSION="${BASH_REMATCH[2]}"
          else
            echo "::error::固件文件名 ${FW_BIN} 无法解析版本号：正式版请按 SoilPulse_v<版本>.bin（如 SoilPulse_v2.1.1.bin），测试版请按 SoilPulse_<commit哈希>.bin（如 SoilPulse_a1b2c3.bin）命名"
            exit 1
          fi

          mkdir -p page/firmware
          echo "Downloading ${FW_URL} ..."
          # 私有仓库 Release 资产需 token：仅当 fw_url 指向 github.com 且配置了 FW_REPO_TOKEN secret 时附加，
          # 避免 token 发往第三方下载主机
          CURL_AUTH=()
          case "$FW_URL" in
            https://github.com/*)
              if [ -n "$FW_TOKEN" ]; then CURL_AUTH=(-H "Authorization: Bearer $FW_TOKEN"); fi
              ;;
          esac
          curl --fail --location --silent --show-error --retry 3 "${CURL_AUTH[@]}" --output "page/firmware/${FW_BIN}" "$FW_URL"

          # 校验下载结果非空，避免发布出损坏的固件升级清单
          if [ ! -s "page/firmware/${FW_BIN}" ]; then
            echo "::error::固件下载失败或文件为空: ${FW_URL}"
            exit 1
          fi

          # 清理旧版本固件 bin，只保留本次清单指向的固件，避免 dist 残留历史文件
          find page/firmware -maxdepth 1 -type f -name '*.bin' ! -name "${FW_BIN}" -delete

          # dev 渠道为强制升级清单（isforce=true）；notes 未填时默认标记为 test firmware
          FW_NOTES=${FW_RAW_NOTES:-test firmware}

          echo "Syncing firmware.json -> version=${FW_VERSION}, bin=${FW_BIN}, size=$(stat -c%s page/firmware/${FW_BIN}), isforce=true..."

          # 用 node 原子更新 JSON 字段（size 从实际 bin 文件大小计算，清单缺失时自动初始化）
          node -e '
            const fs = require("fs");
            const manifestPath = "page/firmware/firmware.json";
            let manifest = {};
            try { manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8")); } catch (_) {}
            const [, version, bin, notes] = process.argv;
            manifest.version = version;
            manifest.bin = bin;
            manifest.size = fs.statSync("page/firmware/" + bin).size;
            manifest.isforce = true;
            manifest.notes = notes;
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          ' "$FW_VERSION" "$FW_BIN" "$FW_NOTES"

          # 验证更新结果
          cat page/firmware/firmware.json
          ls -la page/firmware

      - name: Assemble clean dist
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R page dist/page
          ls -la dist

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未开启 Pages 时自动开启（Source: GitHub Actions）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
