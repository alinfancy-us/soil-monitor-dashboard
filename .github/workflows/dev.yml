name: github-pages-deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: '请输入发布版本号 (例如 1.3.8 或 v1.3.8)'
        required: true
        default: '1.3.8'
      fw_url:
        description: '固件 bin 下载 URL (留空则不更新固件，文件名须按 SoilPulse_v<版本>.bin 或 SoilPulse_<commit哈希>.bin 命名)'
        required: false
        default: ''
      fw_notes:
        description: '固件升级说明 (可选，留空默认写入 test firmware)'
        required: false
        default: ''

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署，避免并发互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync PAGE_VERSION / DASHBOARD_URL from Input
        run: |
          # 去掉用户输入可能带有的 v 前缀
          RAW_VERSION="${{ github.event.inputs.version }}"
          VERSION=${RAW_VERSION#v}
          echo "Syncing PAGE_VERSION to $VERSION..."
          
          # 自动替换 page/js/config.js 中的 PAGE_VERSION
          sed -i "s/const PAGE_VERSION = '[^']*';/const PAGE_VERSION = '$VERSION';/g" page/js/config.js
          
          # dev 预览发布到 GitHub Pages，Bluefy 深链落地页须同步替换为 Pages 地址
          # （生产 deploy.yml 发布到 Cloudflare，固定为自定义域名 https://soilpulse.alinfancy.com）
          echo "Syncing DASHBOARD_URL to GitHub Pages URL..."
          sed -i "s|const DASHBOARD_URL = '[^']*';|const DASHBOARD_URL = 'https://alinfancy-us.github.io/soil-monitor-dashboard/';|g" page/js/config.js

          # 验证替换结果
          grep -E "PAGE_VERSION|DASHBOARD_URL" page/js/config.js

      # 从 fw_url 拉取固件并更新升级清单，isforce=true 强制提醒升级
      # 支持 Actions Artifact zip 链接、Release Asset 链接以及常规 HTTP 链接
      - name: Download firmware & Sync firmware.json
        if: ${{ github.event.inputs.fw_url != '' }}
        env:
          FW_URL: ${{ github.event.inputs.fw_url }}
          FW_RAW_NOTES: ${{ github.event.inputs.fw_notes }}
          GH_TOKEN: ${{ secrets.FW_REPO_TOKEN }}
        run: |
          mkdir -p page/firmware

          # 提取 URL 中的 repo 路径 (如 alinfancy-us/bth_soil_sensor)
          REPO_PATH=$(echo "$FW_URL" | sed -E 's|https://github\.com/([^/]+/[^/]+)/.*|\1|')

          # 1. 情况一：判断是否为 Actions Artifact 链接 (/artifacts/xxxx)
          if [[ "$FW_URL" =~ /artifacts/([0-9]+) ]]; then
            ARTIFACT_ID="${BASH_REMATCH[1]}"
            API_URL="https://api.github.com/repos/${REPO_PATH}/actions/artifacts/${ARTIFACT_ID}/zip"
            
            echo "Detected Actions Artifact link. Downloading via API: ${API_URL}"
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::下载私有 Actions Artifact 必须配置 FW_REPO_TOKEN"
              exit 1
            fi

            # 下载 zip 并解压
            curl --fail --location --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              --output "page/firmware/artifact.zip" "$API_URL"

            unzip -o page/firmware/artifact.zip -d page/firmware/
            rm page/firmware/artifact.zip
            FW_BIN=$(basename $(ls page/firmware/*.bin | head -n 1))

          # 2. 情况二：判断是否为 GitHub Release 链接 (/releases/download/xxx 或 /releases/tag/xxx)
          elif [[ "$FW_URL" =~ /releases/ ]]; then
            echo "Detected GitHub Release link. Downloading using gh cli..."
            
            # 从 URL 中提取 tag (例如 /releases/download/v1.1.1/xxx.bin -> v1.1.1)
            TAG_NAME=$(echo "$FW_URL" | sed -E 's|.*/releases/(download|tag)/([^/]+).*|\2|')
            
            # 解析要下载的文件名 pattern (若 URL 带具体文件名则匹配文件名，否则匹配 .bin)
            FILE_PATTERN="${FW_URL%%\?*}"
            FILE_PATTERN="${FILE_PATTERN##*/}"
            if [[ ! "$FILE_PATTERN" =~ \.bin$ ]]; then
              FILE_PATTERN="*.bin"
            fi

            echo "Fetching asset from repo: ${REPO_PATH}, tag: ${TAG_NAME}, pattern: ${FILE_PATTERN}"
            
            # 使用 gh release download 工具下载，原生处理权限与重定向
            gh release download "$TAG_NAME" \
              --repo "$REPO_PATH" \
              --pattern "$FILE_PATTERN" \
              --dir page/firmware/ \
              --clobber

            FW_BIN=$(basename $(ls page/firmware/*.bin | head -n 1))

          # 3. 情况三：普通外网/直链 URL
          else
            FW_BIN="${FW_URL%%\?*}"
            FW_BIN="${FW_BIN##*/}"
            if [ -z "$FW_BIN" ]; then
              echo "::error::无法从 fw_url 解析出 bin 文件名: ${FW_URL}"
              exit 1
            fi

            echo "Downloading ${FW_URL} ..."
            CURL_AUTH=()
            case "$FW_URL" in
              https://github.com/*)
                if [ -n "$GH_TOKEN" ]; then CURL_AUTH=(-H "Authorization: Bearer $GH_TOKEN"); fi
                ;;
            esac
            curl --fail --location --silent --show-error --retry 3 "${CURL_AUTH[@]}" --output "page/firmware/${FW_BIN}" "$FW_URL"
          fi

          # ===== 校验下载产物（非空、二进制固件、文件名） =====
          if [ ! -s "page/firmware/${FW_BIN}" ]; then
            echo "::error::固件下载失败或文件为空: ${FW_URL}"
            exit 1
          fi

          # 内容校验：拒绝空文件 / HTML 错误页
          ARTIFACT_RC=0
          node -e '
            const b = require("fs").readFileSync(process.argv[1]);
            if (b.length === 0) process.exit(1);
            const head = b.subarray(0, 512).toString("latin1").toLowerCase();
            if (head.includes("<!doctype html") || head.includes("<html")) process.exit(2);
            if (!b.includes(0)) process.exit(3);
          ' "page/firmware/${FW_BIN}" || ARTIFACT_RC=$?
          case "$ARTIFACT_RC" in
            0) : ;;
            1) echo "::error::下载产物为空文件: ${FW_URL}"; exit 1 ;;
            2) echo "::error::下载产物是 HTML 页面而非固件二进制（请确认 Token 是否具备权限或 URL 是否正确）: ${FW_URL}"; exit 1 ;;
            3) echo "::error::下载产物不是二进制固件（未检测到二进制特征）: ${FW_URL}"; exit 1 ;;
            *) echo "::error::下载产物校验失败 (rc=${ARTIFACT_RC}): ${FW_URL}"; exit 1 ;;
          esac

          # 清理旧版本固件 bin，只保留本次清单指向的固件
          find page/firmware -maxdepth 1 -type f -name '*.bin' ! -name "${FW_BIN}" -delete

          # 从下载产物文件名解析清单版本号
          if [[ "$FW_BIN" =~ ^(SoilPulse_)?[vV]([0-9]+(\.[0-9]+)+)\.bin$ ]]; then
            FW_VERSION="${BASH_REMATCH[2]}"
          elif [[ "$FW_BIN" =~ ^(SoilPulse_)?([0-9a-fA-F]{6,40})\.bin$ ]]; then
            FW_VERSION="${BASH_REMATCH[2]}"
          else
            echo "::error::下载产物文件名 ${FW_BIN} 不符合命名约定，无法解析版本号"
            exit 1
          fi

          FW_NOTES=${FW_RAW_NOTES:-test firmware}

          echo "Syncing firmware.json -> version=${FW_VERSION}, bin=${FW_BIN}, size=$(stat -c%s page/firmware/${FW_BIN}), isforce=true..."

          node -e '
            const fs = require("fs");
            const manifestPath = "page/firmware/firmware.json";
            let manifest = {};
            try { manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8")); } catch (_) {}
            const [, version, bin, notes] = process.argv;
            manifest.version = version;
            manifest.bin = bin;
            manifest.size = fs.statSync("page/firmware/" + bin).size;
            manifest.isforce = true;
            manifest.notes = notes;
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          ' "$FW_VERSION" "$FW_BIN" "$FW_NOTES"

          cat page/firmware/firmware.json
          ls -la page/firmware

      - name: Assemble clean dist
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R page dist/page
          ls -la dist

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未开启 Pages 时自动开启（Source: GitHub Actions）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4