name: Deploy Dashboard on Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync PAGE_VERSION from Git Tag
        run: |
          # 获取去掉了 v 前缀的版本号（例如从 v1.3.8 提取 1.3.8）
          VERSION=${GITHUB_REF_NAME#v}
          echo "Syncing PAGE_VERSION to $VERSION..."
          
          # 自动替换 page/js/config.js 中的 PAGE_VERSION
          sed -i "s/const PAGE_VERSION = '[^']*';/const PAGE_VERSION = '$VERSION';/g" page/js/config.js
          
          # 验证替换结果
          grep "PAGE_VERSION" page/js/config.js

      # 从 SoilPulse 固件仓库 Release 拉取固件并更新升级清单：
      # 固件 tag / 说明直接读取仓库 Actions Variables（FW_TAG / FW_NOTES）。
      # 在仓库 Settings -> Secrets and variables -> Actions -> Variables 中配置 FW_TAG（如 v2.1.1）
      # 与 FW_NOTES 后自动执行；若未配置 FW_TAG 则跳过固件更新。
      - name: Download firmware & Sync firmware.json
        if: ${{ vars.FW_TAG != '' }}
        env:
          FW_RAW_TAG: ${{ vars.FW_TAG }}
          FW_RAW_NOTES: ${{ vars.FW_NOTES }}
          GH_TOKEN: ${{ secrets.FW_REPO_TOKEN }}
          REPO_PATH: "alinfancy-us/bth_soil_sensor"
        run: |
          # 规范化 release tag：去掉可能输入的 v 前缀后统一补回，得到 v2.1.1 形式
          FW_NUM=$(echo "$FW_RAW_TAG" | sed 's/^[vV]//')
          if [ -z "$FW_NUM" ]; then
            echo "::error::固件 release tag 不能为空"
            exit 1
          fi
          FW_TAG="v${FW_NUM}"

          # bin 文件名与 Release 资产命名一致：SoilPulse_v<版本>.bin
          FW_BIN="SoilPulse_${FW_TAG}.bin"

          mkdir -p page/firmware
          echo "Downloading ${FW_BIN} from repo: ${REPO_PATH}, tag: ${FW_TAG} using gh cli..."

          # 使用 gh cli 进行安全的权限重定向与资产下载
          gh release download "$FW_TAG" \
            --repo "$REPO_PATH" \
            --pattern "$FW_BIN" \
            --dir page/firmware/ \
            --clobber

          # ===== 校验下载产物（非空、二进制固件、文件名） =====
          if [ ! -s "page/firmware/${FW_BIN}" ]; then
            echo "::error::固件下载失败或文件为空，请确认 Release ${FW_TAG} 已发布且包含资产 ${FW_BIN}"
            exit 1
          fi

          # 内容校验：拒绝空文件 / HTML 错误页
          ARTIFACT_RC=0
          node -e '
            const b = require("fs").readFileSync(process.argv[1]);
            if (b.length === 0) process.exit(1);
            const head = b.subarray(0, 512).toString("latin1").toLowerCase();
            if (head.includes("<!doctype html") || head.includes("<html")) process.exit(2);
            if (!b.includes(0)) process.exit(3);
          ' "page/firmware/${FW_BIN}" || ARTIFACT_RC=$?
          case "$ARTIFACT_RC" in
            0) : ;;
            1) echo "::error::下载产物为空文件"; exit 1 ;;
            2) echo "::error::下载产物是 HTML 页面而非固件二进制（请确认 Token 是否具备权限或 Release Tag 是否正确）"; exit 1 ;;
            3) echo "::error::下载产物不是二进制固件（未检测到二进制特征）"; exit 1 ;;
            *) echo "::error::下载产物校验失败 (rc=${ARTIFACT_RC})"; exit 1 ;;
          esac

          # 清理旧版本固件 bin，只保留本次清单指向的固件，避免 dist 残留历史文件
          find page/firmware -maxdepth 1 -type f -name 'SoilPulse_*.bin' ! -name "${FW_BIN}" -delete

          echo "Syncing firmware.json -> version=${FW_TAG#v}, bin=${FW_BIN}, size=$(stat -c%s page/firmware/${FW_BIN}), isforce=false..."

          # 用 node 原子更新 JSON 字段（version 去掉 v 前缀，size 从实际 bin 文件大小计算，
          # isforce 置 false——生产渠道只按版本号正常提醒，不做强制升级，notes 可选更新）
          node -e '
            const fs = require("fs");
            const manifestPath = "page/firmware/firmware.json";
            let manifest = {};
            try { manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8")); } catch (_) {}
            const [, version, bin, notes] = process.argv;
            manifest.version = version;
            manifest.bin = bin;
            manifest.size = fs.statSync("page/firmware/" + bin).size;
            manifest.isforce = false;
            if (notes !== "") manifest.notes = notes;
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          ' "${FW_TAG#v}" "${FW_BIN}" "$FW_RAW_NOTES"

          # 验证更新结果
          cat page/firmware/firmware.json
          ls -la page/firmware

      - name: Assemble clean dist
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R page dist/page
          ls -la dist

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=soil-monitor-dashboard --branch=main