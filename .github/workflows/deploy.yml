name: Deploy Dashboard on Tag

# 推送形如 v1.0.0 的 tag 时自动部署仪表盘到 Cloudflare Workers；
# 也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - 'v*'  # 仅当推送形如 v1.0.0 的 Tag 时触发
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 只发布站点本身（index.html + page/），避免把 README/start_service.sh 发布到公网
      - name: Assemble clean dist (index.html + page/)
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R page dist/page
          ls -la dist

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # 仓库 Secret：muddy-cake-1e70 token 的值
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} # 仓库 Secret：d9aadf21ba6ee3d33c0ffae0527c8054
